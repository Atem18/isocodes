name: Coverage

# 100% is enforced by fail_under in pyproject.toml.

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  coverage:
    name: Measure and enforce coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run the suite under coverage
        env:
          # Lets the CLI tests that shell out be measured too.
          COVERAGE_PROCESS_START: pyproject.toml
        run: uv run --group test --with coverage coverage run -m pytest -q

      - name: Report, failing under 100%
        run: |
          uv run --with coverage coverage combine
          uv run --with coverage coverage report
