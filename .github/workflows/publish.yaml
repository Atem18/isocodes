name: Release to PyPI
# Publishing a GitHub Release is the release gate, not pushing a tag. A tag on
# its own now ships nothing, so a scratch or mistaken tag cannot reach PyPI.
on:
  release:
    types: [published]
jobs:
  # A release can be cut from any commit, including one that never landed on
  # main, so the suite runs again here rather than trusting that it already has.
  test:
    uses: ./.github/workflows/tests.yaml
    # A called workflow cannot hold more than its caller grants. The TestPyPI
    # job is skipped on a release, but it asks for id-token, and unlisted scopes
    # drop to none once this block exists, so contents has to be named too.
    permissions:
      contents: read
      id-token: write
  build-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build wheel
        run: uv build
      - name: Publish package
        run: uv publish
